# Keeps docs.khangle.dev in step with the library repos (see docs/CONTRACT.md).
# Hourly and on demand: sync each library's docs/, build, deploy, then commit the synced content.
# Sync, build and deploy share one workflow because a push made with GITHUB_TOKEN does not start
# other workflows.
name: sync

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Re-sync every library even when nothing changed
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Sync library docs
        id: sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync/index.mjs ${{ inputs.force && '--force' || '' }}
          if git status --porcelain content | grep -q .; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      # A page that breaks the build is dropped back to the last committed content, so the site
      # keeps deploying. The issue step below reports both kinds of failure.
      - name: Build
        id: build
        run: |
          if ! pnpm build > build.log 2>&1; then
            cat build.log
            echo "Build failed with the new content; rebuilding with the last committed content."
            { echo "Build failed with newly synced content:"; echo; tail -40 build.log; } >> sync-errors.txt
            git checkout -- content && git clean -fdq content
            echo "changed=false" >> "$GITHUB_OUTPUT"
            pnpm build
          fi

      - name: Deploy
        if: github.event_name != 'schedule' || steps.sync.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::warning::CLOUDFLARE_API_TOKEN is not set; skipping deploy."; exit 0; fi
          pnpm exec wrangler deploy

      - name: Commit synced content
        if: steps.sync.outputs.changed == 'true' && steps.build.outputs.changed != 'false'
        run: |
          git config user.name "docs-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "sync: update library docs [skip ci]"
          git push

      - name: Report sync problems
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f sync-errors.txt ] || exit 0
          title="Docs sync problem"
          body="$(printf 'The last sync kept the previous pages for the libraries below.\n\n```\n%s\n```\n\nRun: %s' "$(cat sync-errors.txt)" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
